<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Alerts - NWS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Alerts</h1>
        <p>Enter a two‑letter US state abbreviation (e.g., NY, CA, TX).</p>

        <div class="input-group">

          <input type="text" id="state-input" placeholder="Enter state abbreviation" maxlength="2" autocomplete="off">
            <button id="fetch-alerts">Get Weather Alerts</button>
        </div>

        <div id="error-message" class="error hidden"></div>
        <div id="alerts-container"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
